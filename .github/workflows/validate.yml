name: Validate Neuro PT data and logic

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Check JavaScript syntax
        run: |
          find js tests -name '*.js' -o -name '*.mjs' | while read file; do node --check "$file"; done
      - name: Run dependency-free smoke tests
        run: npm test
