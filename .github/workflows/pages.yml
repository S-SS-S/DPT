name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          BASE="${PAGE_URL%/}"
          HTML="$(curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 "$PAGE_URL")"
          printf '%s' "$HTML" | grep -Fq '<title>Neuro PT Clinical Companion</title>'
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 "$BASE/css/styles.css" >/dev/null
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 "$BASE/js/app.js" | grep -Fq 'Clinical Insight Engine'
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 "$BASE/manifest.webmanifest" | grep -Fq 'Neuro PT Clinical Companion'
          curl -fsSL --retry 8 --retry-all-errors --retry-delay 2 "$BASE/service-worker.js" | grep -Fq 'neuropt-v1.0.0'
          echo "Production smoke check passed: $PAGE_URL"
